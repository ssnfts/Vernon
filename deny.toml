# cargo-deny configuration. Run: cargo deny check licenses bans sources
# Policy source: AGENTS.md rule 3 and CLEAN_ROOM.md ("Dependencies and build scripts").

[graph]
# Resolve for the three supported CI targets, not for every platform in Cargo.lock.
targets = [
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[licenses]
# Permissive only: MIT, Apache-2.0, BSD, Zlib, ISC, Unicode, BSL-1.0, CC0.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

# The bundled UI fonts carry OFL / Ubuntu licences (documented in CLEAN_ROOM.md
# and THIRD_PARTY_LICENSES.md). They are font data, not linked code.
exceptions = [
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
# No crate may compile C or C++ in a build script. `cc` is in Cargo.lock only
# because wayland-backend lists it as a build dependency that runs only with its
# `log` feature (off here). Nothing else may depend on it. The strict per-target
# check, including the Windows GNU target, is scripts/release/check-deps.ps1.
deny = [
    { crate = "cc", wrappers = ["wayland-backend"] },
    { crate = "cmake" },
    { crate = "bindgen" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
