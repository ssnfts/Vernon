[package]
name = "vernon-io"
description = "Vernon file I/O: OBJ, STL, PLY, 3MF and XYZ/PTS, plus E57 and LAS point-cloud readers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vernon-core.workspace = true
glam.workspace = true
thiserror.workspace = true
# Raw DEFLATE for the 3MF zip container. Pure Rust, no build script,
# MIT OR Zlib OR Apache-2.0. The zip container and XML are hand-parsed.
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
